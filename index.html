<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WestX Duel Box</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:ital,wght@0,500;0,700;1,700&display=swap" />
    <style>
      /* Layout: a full-bleed 3D arena. The HUD sits in the top corners like a fight
         broadcast, and menus are wanted posters pinned over the action. */
      :root {
        color-scheme: dark;
        --ink: #1a1320;
        --ink-soft: rgba(26, 19, 32, 0.78);
        --paper: #f6e7c8;
        --paper-dim: #cdbb98;
        --sand: #d9a066;
        --ember: #ff7a3c;
        --gold: #ffd24a;
        --crimson: #ff4a6e;
        --fulgur: #5ef2ff;
        --health: #7be36a;
        --display: "Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
        --hud: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--hud);
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #view {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view" tabindex="0" aria-label="WestX duel arena"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
